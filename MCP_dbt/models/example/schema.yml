version: 2

models:
  - name: customer_analytics
    description: "One row per customer with unified metrics for order history, spending behavior, lifecycle, and behavioral segment. This model is used by analytics, marketing, and product teams as the primary customer 360 view."
    columns:
      - name: customer_id
        description: "Surrogate key for the customer, matching app.customers.customer_id. Uniquely identifies a person across all downstream customer analytics and should be used for joins to other customer-level models."
        tests:
          - not_null
          - unique
      - name: email
        description: "Primary contact email for the customer, sourced from app.customers.email. Used for CRM integrations, campaign targeting, and deduping customer records."
        tests:
          - not_null
      - name: lifetime_value
        description: "Total revenue generated by the customer across all historical orders, in the store’s base currency. Computed as the sum of order.total_amount and defaults to 0 for customers with no orders."
        tests:
          - not_null
      - name: customer_segment
        description: "Behavioral segment derived from order frequency: 'inactive' (0 orders), 'occasional' (1–4 orders), 'regular' (5–14 orders), and 'vip' (15+ orders). Used for audience definitions, lifecycle analysis, and personalization rules."
        tests:
          - not_null
          - accepted_values:
              values: ['inactive', 'occasional', 'regular', 'vip']
      - name: total_orders
        description: "Count of distinct orders placed by the customer over their lifetime. Includes all historical orders regardless of status and is used for frequency, retention, and cohort-style analyses."
        tests:
          - not_null
